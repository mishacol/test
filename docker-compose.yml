services:
  extraction:
    build: ./services/extraction
    ports:
      - "8001:8001"

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    environment:
      EXTRACTION_SERVICE_URL: http://extraction:8001
    depends_on:
      - extraction
    volumes:
      - gateway-data:/app/data

volumes:
  gateway-data:
